<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros. - Standard Brick Platforms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { margin: 0; padding: 0; background-color: #5c94fc; color: #ffffff; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer inset-0 flex flex-col justify-between p-6 pointer-events-none">
        <div class="flex justify-between items-center w-full max-w-md mx-auto">
            <div class="bg-black/90 border-4 border-white px-6 py-2 text-white shadow-2xl flex gap-8 font-bold tracking-widest text-sm">
                <div>
                    <p class="text-[10px] text-red-500">MARIO</p>
                    <p id="score-val">000000</p>
                </div>
                <div>
                    <p class="text-[10px] text-amber-400">COIN</p>
                    <p id="coin-val">$00</p>
                </div>
                <div>
                    <p class="text-[10px] text-cyan-400">WORLD</p>
                    <p>1-1</p>
                </div>
            </div>
        </div>

        <div id="overlay-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-[#5c94fc] interactive">
            <div class="text-center p-8 rounded-xl border-4 border-white bg-black shadow-2xl max-w-sm w-full">
                <h1 id="screen-title" class="text-3xl font-black tracking-widest text-[#fcbc32] mb-4 drop-shadow-[4px_4px_0_#cc0000]">SUPER MARIO</h1>
                <p id="screen-subtitle" class="text-xs text-white mb-8 leading-relaxed">PRESS SPACE / UP TO JUMP<br>USE A/D OR ARROWS TO MOVE</p>
                <button onclick="startGame()" class="w-full bg-[#e52521] text-white font-black tracking-widest py-3 border-2 border-white hover:bg-red-700 transition shadow-[0_4px_0_#880000]">GAME START</button>
            </div>
        </div>

        <div class="flex justify-center pb-2">
            <div class="bg-black/60 border border-white/40 px-4 py-1 text-[10px] text-white tracking-widest">
                STANDARD CLASSIC NES BRICK PLATFORMS
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let gameStarted = false, gameOver = false;
        let score = 0, coins = 0;

        let playerGroup, legLeft, legRight, armLeft, armRight;
        let player = { x: 0, y: 3, z: 0, vx: 0, vy: 0, speed: 0.12, jumpStrength: 0.22, gravity: 0.009, width: 0.7, height: 1.2, isJumping: false };
        let floors = [];
        let floorTimer = 0;
        let poleDescentSpeed = 0.04;

        // NES Palette Hex Codes (Standard Bricks Only)
        let matBrick, matBrickTop, matMarioRed, matMarioBlue, matSkin, matHairBrown, matWhite;

        const KEYS = { left: false, right: false };

        initGraphics();
        initScene();
        setupEvents();
        animate();

        function initGraphics() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5c94fc); // NES Sky Blue

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 12);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1);
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function initScene() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            // NES Palette Materials
            matBrick = new THREE.MeshBasicMaterial({ color: 0xc84c0c });       
            matBrickTop = new THREE.MeshBasicMaterial({ color: 0xfc9838 });    
            matMarioRed = new THREE.MeshBasicMaterial({ color: 0xd82800 });    
            matMarioBlue = new THREE.MeshBasicMaterial({ color: 0x0070ec });   
            matSkin = new THREE.MeshBasicMaterial({ color: 0xfcc0ac });        
            matHairBrown = new THREE.MeshBasicMaterial({ color: 0x684400 });   
            matWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });       

            createExactNESMario();
        }

        function createExactNESMario() {
            playerGroup = new THREE.Group();

            const shoeGeo = new THREE.BoxGeometry(0.16, 0.12, 0.28);
            const lShoe = new THREE.Mesh(shoeGeo, matHairBrown);
            lShoe.position.set(-0.13, 0.06, 0.02);
            const rShoe = new THREE.Mesh(shoeGeo, matHairBrown);
            rShoe.position.set(0.13, 0.06, 0.02);

            legLeft = new THREE.Group();
            legLeft.add(lShoe);
            legRight = new THREE.Group();
            legRight.add(rShoe);
            playerGroup.add(legLeft, legRight);

            const overallsGeo = new THREE.BoxGeometry(0.44, 0.30, 0.30);
            const overalls = new THREE.Mesh(overallsGeo, matMarioBlue);
            overalls.position.set(0, 0.28, 0);
            playerGroup.add(overalls);

            const btnGeo = new THREE.BoxGeometry(0.05, 0.05, 0.03);
            const btnL = new THREE.Mesh(btnGeo, matHairBrown);
            btnL.position.set(-0.10, 0.36, 0.16);
            const btnR = new THREE.Mesh(btnGeo, matHairBrown);
            btnR.position.set(0.10, 0.36, 0.16);
            playerGroup.add(btnL, btnR);

            const shirtGeo = new THREE.BoxGeometry(0.48, 0.26, 0.28);
            const shirt = new THREE.Mesh(shirtGeo, matMarioRed);
            shirt.position.set(0, 0.56, 0);
            playerGroup.add(shirt);

            const armGeo = new THREE.BoxGeometry(0.13, 0.20, 0.15);
            armLeft = new THREE.Group();
            const lArm = new THREE.Mesh(armGeo, matMarioRed);
            const lGlove = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.13, 0.17), matWhite);
            lGlove.position.set(0, -0.11, 0.01);
            armLeft.add(lArm, lGlove);
            armLeft.position.set(-0.31, 0.56, 0);

            armRight = new THREE.Group();
            const rArm = new THREE.Mesh(armGeo, matMarioRed);
            const rGlove = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.13, 0.17), matWhite);
            rGlove.position.set(0, -0.11, 0.01);
            rArm.add(rGlove);
            armRight.add(rArm);
            armRight.position.set(0.31, 0.56, 0);
            playerGroup.add(armLeft, armRight);

            const headGeo = new THREE.BoxGeometry(0.42, 0.38, 0.36);
            const head = new THREE.Mesh(headGeo, matSkin);
            head.position.set(0, 0.88, 0);
            playerGroup.add(head);

            const noseGeo = new THREE.BoxGeometry(0.13, 0.13, 0.16);
            const nose = new THREE.Mesh(noseGeo, matSkin);
            nose.position.set(0, 0.84, 0.24);
            playerGroup.add(nose);

            const mustacheGeo = new THREE.BoxGeometry(0.38, 0.10, 0.10);
            const mustache = new THREE.Mesh(mustacheGeo, matHairBrown);
            mustache.position.set(0, 0.75, 0.20);
            playerGroup.add(mustache);

            const eyeGeo = new THREE.BoxGeometry(0.07, 0.10, 0.03);
            const eyeL = new THREE.Mesh(eyeGeo, matHairBrown);
            eyeL.position.set(-0.10, 0.95, 0.19);
            const eyeR = new THREE.Mesh(eyeGeo, matHairBrown);
            eyeR.position.set(0.10, 0.95, 0.19);
            playerGroup.add(eyeL, eyeR);

            const hairGeo = new THREE.BoxGeometry(0.42, 0.10, 0.28);
            const hair = new THREE.Mesh(hairGeo, matHairBrown);
            hair.position.set(0, 0.96, -0.05);
            playerGroup.add(hair);

            const capGeo = new THREE.BoxGeometry(0.46, 0.16, 0.42);
            const cap = new THREE.Mesh(capGeo, matMarioRed);
            cap.position.set(0, 1.12, 0);

            const visorGeo = new THREE.BoxGeometry(0.42, 0.04, 0.20);
            const visor = new THREE.Mesh(visorGeo, matMarioRed);
            visor.position.set(0, 1.05, 0.25);

            const badgeGeo = new THREE.BoxGeometry(0.12, 0.12, 0.02);
            const badge = new THREE.Mesh(badgeGeo, matWhite);
            badge.position.set(0, 1.13, 0.22);

            const mGeo = new THREE.BoxGeometry(0.07, 0.07, 0.03);
            const mText = new THREE.Mesh(mGeo, matMarioRed);
            mText.position.set(0, 1.13, 0.23);

            playerGroup.add(cap, visor, badge, mText);
            scene.add(playerGroup);
        }

        function resetGame() {
            gameOver = false;
            score = 0;
            coins = 0;
            poleDescentSpeed = 0.04;
            floors.forEach(f => scene.remove(f.mesh));
            floors = [];

            player.x = 0;
            player.y = 3;
            player.vx = 0;
            player.vy = 0;
            player.isJumping = false;

            for (let i = 0; i < 10; i++) {
                spawnPlatform((Math.random() * 6) - 3, i * 1.2 - 2);
            }

            document.getElementById('overlay-screen').style.opacity = '0';
            document.getElementById('overlay-screen').style.pointerEvents = 'none';
            gameStarted = true;
        }

        function spawnPlatform(x, y) {
            const group = new THREE.Group();
            
            // Standard NES Brick Platform only
            const width = 2.4;
            const height = 0.3;
            const depth = 0.8;

            const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), matBrick);
            group.add(baseMesh);

            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, depth), matBrickTop);
            topMesh.position.y = 0.15;
            group.add(topMesh);

            group.position.set(x, y, 0);
            scene.add(group);

            floors.push({ mesh: group, x: x, y: y, width: width, height: height });
        }

        function setupEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.code === "ArrowLeft" || e.code === "KeyA") KEYS.left = true;
                if (e.code === "ArrowRight" || e.code === "KeyD") KEYS.right = true;
                if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") handleJump();
                if (!gameStarted && (e.code === "Space" || e.code === "ArrowUp")) startGame();
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === "ArrowLeft" || e.code === "KeyA") KEYS.left = false;
                if (e.code === "ArrowRight" || e.code === "KeyD") KEYS.right = false;
            });

            const canvas = renderer.domElement;
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!gameStarted || gameOver) { startGame(); return; }
                const rect = canvas.getBoundingClientRect();
                const tx = e.touches[0].clientX - rect.left;
                const ty = e.touches[0].clientY - rect.top;
                if (ty < canvas.height * 0.4) handleJump();
                else if (tx < canvas.width * 0.5) { KEYS.left = true; KEYS.right = false; }
                else { KEYS.right = true; KEYS.left = false; }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                KEYS.left = false; KEYS.right = false;
            }, { passive: false });
        }

        function handleJump() {
            if (!player.isJumping && gameStarted && !gameOver) {
                player.vy = player.jumpStrength;
                player.isJumping = true;
            }
        }

        function startGame() {
            if (!gameStarted || gameOver) resetGame();
        }

        function update() {
            if (!gameStarted || gameOver) return;

            poleDescentSpeed = 0.04 + Math.floor(score / 500) * 0.005;

            if (KEYS.left) player.vx = -player.speed;
            else if (KEYS.right) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            if (player.x < -3.2) player.x = -3.2;
            if (player.x > 3.2) player.x = 3.2;

            player.vy -= player.gravity;
            player.y += player.vy;

            floors.forEach(f => {
                f.y -= poleDescentSpeed;
                f.mesh.position.y = f.y;
            });

            let targetY = 2.0;
            if (player.y > targetY) {
                let diff = player.y - targetY;
                player.y = targetY;
                floors.forEach(f => {
                    f.y -= diff;
                    f.mesh.position.y = f.y;
                });
                score += Math.floor(diff * 100);
                coins = Math.floor(score / 1000);
                document.getElementById('score-val').innerText = String(score).padStart(6, '0');
                document.getElementById('coin-val').innerText = '$' + String(coins).padStart(2, '0');
            }

            floorTimer++;
            if (floorTimer > 35) {
                spawnPlatform((Math.random() * 6) - 3, 6.5);
                floorTimer = 0;
            }

            for (let i = floors.length - 1; i >= 0; i--) {
                if (floors[i].y < -5) {
                    scene.remove(floors[i].mesh);
                    floors.splice(i, 1);
                }
            }

            floors.forEach(f => {
                const platformTop = f.y + f.height / 2;
                if (
                    player.vy <= 0 &&
                    player.x + player.width/2 > f.x - f.width/2 &&
                    player.x - player.width/2 < f.x + f.width/2 &&
                    player.y >= platformTop &&
                    player.y + player.vy <= platformTop + 0.25
                ) {
                    player.y = platformTop;
                    player.vy = 0;
                    player.isJumping = false;
                }
            });

            playerGroup.position.set(player.x, player.y, 0);

            if (player.y < -3.5) triggerGameOver();
        }

        function triggerGameOver() {
            gameOver = true;
            const overlay = document.getElementById('overlay-screen');
            document.getElementById('screen-title').innerText = "GAME OVER";
            document.getElementById('screen-subtitle').innerText = `FINAL SCORE: ${String(score).padStart(6, '0')}`;
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
